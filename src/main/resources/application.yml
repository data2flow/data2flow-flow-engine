# 공통 설정(design/conventions.md §4). 환경별 값은 application-{local,staging,prod}.yml, 비밀값은 환경변수.
spring:
  application:
    name: data2flow-flow-engine
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  messages:
    # 오류 문구(ADR-037: ko 원문, en·ja·zh). 키는 error.<코드>
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  # 실행 상태 저장소: s3 공용 PostgreSQL DB data2flow, 스키마 data2flow_flow(ADR-019). 값은 환경변수(.env / k8s Secret)
  # ApplicationName은 인스턴스 이름(파드 이름)을 넣어 잠금 보유자를 pg_stat_activity에서 찾을 수 있게 한다
  datasource:
    url: jdbc:postgresql://${DATA2FLOW_DB_HOST:localhost}:${DATA2FLOW_DB_PORT:5432}/${DATA2FLOW_DB_NAME:data2flow}?ApplicationName=${HOSTNAME:data2flow-flow-engine-local}&socketTimeout=30&connectTimeout=5
    username: ${DATA2FLOW_DB_USERNAME:data2flow}
    password: ${DATA2FLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 16
      connection-timeout: 5000
      initialization-fail-timeout: -1
      connection-init-sql: SET TIME ZONE 'UTC'
      # SQL은 스키마 이름 없이 쓴다(data2flow_flow만, 다른 서비스 스키마 쓰기 금지)
      schema: data2flow_flow
  flyway:
    schemas: data2flow_flow
    default-schema: data2flow_flow
    create-schemas: true
  # RabbitMQ(s4, vhost: prod data2flow · staging data2flow-stg · local data2flow-dev, ADR-020·030)
  rabbitmq:
    host: ${DATA2FLOW_RABBITMQ_HOST:localhost}
    port: ${DATA2FLOW_RABBITMQ_PORT:5672}
    virtual-host: ${DATA2FLOW_RABBITMQ_VHOST:data2flow-dev}
    username: ${DATA2FLOW_RABBITMQ_USERNAME:guest}
    password: ${DATA2FLOW_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
server:
  port: 8080
  shutdown: graceful

# actuator는 8081(프로브·지표 전용, k8s Service로 노출하지 않음)
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: false
      group:
        readiness:
          include: readinessState,db,flowRuntime
  health:
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

data2flow:
  identity:
    optional-paths: /internal/**
  flow:
    # ADR-030: DB를 staging·prod가 함께 쓰므로 migrate는 staging 배포(application-staging.yml)와 테스트에서만
    flyway-mode: validate
    instance-id: ${HOSTNAME:data2flow-flow-engine-local}
    # 로컬 개발자 이름(소비자 그룹 flow-<이름>, deployment.md §8.2). 운영·staging은 비운다
    developer: ${DATA2FLOW_DEV_NAME:}
    # 실행(스트림 소비·타이머·아웃박스 발행·설정 수신). 로컬은 끈다(application-local.yml): 같은 DB를 운영이 쓰므로 운영 타이머·아웃박스를 건드리지 않는다
    runtime-enabled: true
    core:
      base-url: ${DATA2FLOW_CORE_URI:http://data2flow-core-api}
      connect-timeout: 2s
      read-timeout: 5s
      # 놓친 설정 변경을 보완하는 주기 폴링(API-FLW-80 sinceVersion, 바뀐 것이 없으면 204)
      sync-interval: 30s
      space-cache-ttl: 5m
    stream:
      port: ${DATA2FLOW_RABBITMQ_STREAM_PORT:5552}
      partitions: 12
      fixed-address: true
    timer:
      poll-interval: 500ms
      batch: 100
      max-attempts: 5
    outbox:
      poll-interval: 200ms
      # 한 묶음을 먼저 다 보내고 확인을 모아 기다린다(파이프라이닝). 초당 200건 부하에서 감지→제어 p95 2초(TC-FLW-134)
      batch: 200
      confirm-timeout: 10s
    execution:
      retry-initial: 200ms
      retry-max: 30s
      max-hops: 100
      max-fanout: 100
      max-state-bytes: 262144
      default-validity: 600s
      # DEGRADED 판정 오류율 기준(BR-FLW-26: 최근 5분 100건 이상에서)
      error-rate-threshold: 0.1
    debug:
      samples-per-second: 5
      debug-samples-per-second: 50
    retention:
      deleted-node-state: 24h
      finished-timers: 7d
      sent-outboxes: 7d
      stale-instance: 10m
      heartbeat: 2m
      cleanup-interval: 10m
    # JS 함수 노드 실행 제한(SCR와 같은 값, SCR-02.02·BR-SCR-02·ADR-008)
    script:
      cpu-time: 50ms
      wall-time: 1s
      statement-limit: 1000000
      max-output-bytes: 65536
      max-log-bytes: 1024
      max-log-entries: 100
      max-string-length: 1048576
      max-array-length: 1048576
      max-code-bytes: 65536
      max-output-depth: 32
      # 시작 예열(공용 샌드박스 ScriptSandbox.warmUp, ADR-046): 대표 스크립트 1회의 감시 구간 CPU가 target 아래로 stable-rounds번
      # 이어질 때까지. 해석 실행(JIT 없음)이라 덜 데워지면 정상 스크립트도 부하 때 50ms를 넘는다. 한도(cpu-time)는 그대로 둔다
      warm-up-rounds: 5
      warm-up-max-rounds: 80
      warm-up-stable-rounds: 3
      warm-up-target: 10ms
      warm-up-max-time: 30s
